[build]
  base = "App"
  command = "npm run build"
  publish = "App/dist"

[build.environment]
  NODE_VERSION = "20"

# Handle Astro's trailing slash requirement
[[redirects]]
  from = "/*"
  to = "/:splat/"
  status = 301
  force = false

# 404 page (with trailing slash)
[[redirects]]
  from = "/*"
  to = "/404/"
  status = 404

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
